<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADHRS-RDC Officiel</title>
<style>
:root{--bleu:#0a4a8a;--fond:#f5f7fa;}
body{margin:0;font-family:Arial,sans-serif;background:var(--fond);color:#222;}
header{background:var(--bleu);color:#fff;text-align:center;padding:25px 15px;}
header img{width:90px;height:90px;border-radius:50%;background:#fff;padding:4px;object-fit:cover;}
.box{max-width:900px;margin:18px auto;background:#fff;padding:18px;border-radius:10px;box-shadow:0 2px 6px #0001;}
h2{color:var(--bleu);border-bottom:2px solid var(--bleu);padding-bottom:6px;font-size:18px;}
.carte{border-left:4px solid var(--bleu);padding:10px 12px;margin:10px 0;background:#fafafa;border-radius:5px;}
.tag{display:inline-block;background:var(--bleu);color:#fff;padding:2px 8px;border-radius:4px;font-size:11px;}
small{color:#666;}
.btn-wa{display:inline-block;background:#25D366;color:#fff;padding:5px 10px;border-radius:5px;text-decoration:none;font-size:13px;margin-top:5px;}
footer{text-align:center;padding:15px;color:#666;font-size:13px;}
</style>
</head>
<body>
<header>
<img src="logo.jpg" alt="ADHRS-RDC">
<h1>ADHRS-RDC</h1>
<p>Actions pour la Defense des Droits Humains et Reinsertion Sociale</p>
</header>

<div class="box"><h2>📢 Annonces</h2><div id="annonces">Chargement...</div></div>
<div class="box"><h2>👥 Membres</h2><div id="membres">Chargement...</div></div>
<div class="box"><h2>🎯 Activités - Grandes Catégories</h2><div id="activites">Chargement...</div></div>
<div class="box"><h2>🤝 Partenariats</h2><div id="partenaires">Chargement...</div></div>

<footer>ADHRS-RDC © 2026 - Kinshasa, RDC - Contact WhatsApp disponible</footer>

<script>
function safeFetch(file, callback){
  fetch(file).then(r=>{ if(!r.ok) throw new Error(); return r.json(); }).then(callback).catch(()=>{ document.getElementById(file.split('.')[0])?.innerHTML && (document.getElementById(file.split('.')[0]).innerHTML = "") });
}

fetch('annonces.json').then(r=>r.json()).then(d=>{
  let h=''; d.forEach(a=>{
    let wa=encodeURIComponent(a.titre+' - '+a.message);
    h+=`<div class="carte"><span class="tag">${a.type||'INFO'}</span> <small>${a.date||''} | ${a.lieu||''}</small><h4>${a.titre||''}</h4><p>${a.message||''}</p><a class="btn-wa" href="https://wa.me/?text=${wa}" target="_blank">Partager WhatsApp</a></div>`;
  });
  document.getElementById('annonces').innerHTML = h || 'Aucune annonce';
}).catch(()=>{ document.getElementById('annonces').innerHTML='Aucune annonce pour le moment'; });

fetch('membres.json').then(r=>r.json()).then(d=>{
  let h=''; d.forEach(m=>{
    h+=`<div class="carte"><h4>${m.nom||''}</h4><p><b>${m.fonction||''}</b><br>📍 ${m.commune||''} ${m.quartier?'/ Q/'+m.quartier:''} ${m.avenue?'/ Av.'+m.avenue:''}<br>📞 ${m.telephone||''}</p></div>`;
  });
  document.getElementById('membres').innerHTML = h || 'Aucun membre';
}).catch(()=>{ document.getElementById('membres').innerHTML='Aucun membre pour le moment'; });

fetch('activites.json').then(r=>r.json()).then(d=>{
  const cats={}; d.forEach(a=>{ const k=(a.categorie||'AUTRE').toUpperCase(); if(!cats[k]) cats[k]=[]; cats[k].push(a); });
  let h=''; for(let c in cats){ h+=`<h3 style="color:#0a4a8a;margin-top:18px;">${c}</h3>`; cats[c].forEach(a=>{ h+=`<div class="carte"><small>${a.date||''}</small><h4>${a.titre||''}</h4><p>${a.description||''}</p></div>`; }); }
  document.getElementById('activites').innerHTML = h || 'Aucune activite';
}).catch(()=>{ document.getElementById('activites').innerHTML='Ajoutez activites.json pour voir les activites'; });

fetch('partenariats.json').then(r=>r.json()).then(d=>{
  const cats={}; d.forEach(p=>{ const k=(p.type||'AUTRE').toUpperCase(); if(!cats[k]) cats[k]=[]; cats[k].push(p); });
  let h=''; for(let c in cats){ h+=`<h3 style="color:#0a4a8a;margin-top:18px;">${c}</h3>`; cats[c].forEach(p=>{ h+=`<div class="carte"><h4>${p.nom||''}</h4><p>${p.description||''}</p></div>`; }); }
  document.getElementById('partenaires').innerHTML = h || 'Aucun partenariat';
}).catch(()=>{ document.getElementById('partenaires').innerHTML='Ajoutez partenariats.json pour voir les partenariats'; });
</script>
</body>
</html>
